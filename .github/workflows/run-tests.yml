name: run-tests
# The CI image directory is ignored on push because a Dockerfile change alone
# does not change what this job pulls while the new image is still building.
# The workflow_run trigger covers it instead: once publish-ci-image pushes the
# image, the tests run against it.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ci/**'
      - '.github/workflows/publish-package.yml'
      - '.github/workflows/publish-ci-image.yml'
  workflow_run:
    workflows: [publish-ci-image]
    types: [completed]

# A push that supersedes an in-flight run cancels it. The e2e job boots a real
# HAPI server through Maven, so a stacked queue costs 20+ minutes per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests (${{ matrix.package-manager }})
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package-manager: [bun, npm]
    # All toolchains (Maven, JDK, Node, npm, bun) are baked into this image by
    # .github/ci/Dockerfile and published by the publish-ci-image workflow.
    container:
      image: ghcr.io/bstewartlg/nx-fhir-ci:1.0.0
    steps:
      - uses: actions/checkout@v5

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          # The path is absolute because the JVM in this image reports
          # user.home as /root whatever HOME is set to, so Maven writes to
          # /root/.m2 while "~" would expand to the container HOME of
          # /github/home and cache an empty directory.
          path: /root/.m2/repository
          # The generated server pins its HAPI starter release, so the Maven
          # dependency set only changes when a spec or the version constants change.
          key: ${{ runner.os }}-maven-${{ hashFiles('e2e/nx-fhir/tests/**/*.e2e.spec.ts', 'packages/nx-fhir/src/shared/constants/versions.ts') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # bun and npm both honour HOME, so "~" is the container HOME here
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The e2e suites on this leg install generated workspaces with npm, so
      # the npm download cache is worth keeping warm.
      - name: Cache npm cache
        if: matrix.package-manager == 'npm'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: bun install
      # The unit tests mock all package manager interactions, so one run
      # covers both legs.
      - name: Run tests
        if: matrix.package-manager == 'bun'
        run: bun run test -- --coverage
      - name: Run E2E Tests
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: bun run e2e
